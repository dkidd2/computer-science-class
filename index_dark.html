<!doctype html>
<!--added a dark mode -->
<html lang="en" data-bs-theme="dark">
  <head>
    <!--added my portriat pic-->
    <style>
      .my-pic {
        width: 80px;
        height: 80px;
        margin: 1px 40px 135px 400px;
      }
    </style>
    <title>Bootstrap Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>
    <!-- Web page content goes inside Bootstrap container(s) -->

    <div class="container" style="margin: auto;">
      <h1>Home</h1>
      <!--adding card to my name and about info-->
      <div class="card bg-secondary text-black" style="margin:auto;"><h3>Dylan Mateo Kidd</h3></div>
      <div class="card bg-dark text-white"  style="margin:auto;"><p> <ul> <li>
        Degree: Advanced Manufacturing Sciences.</li> 
       <li> Concentration: Mechanical
        Engineering Technician</li> </ul>
      </p></div>
    <div class="my-pic">
        <img
          src="images/Portriat_pic.jpg"
          class="img-fluid"
          alt="MEEE!!!"
          width="100"
          height="100"
        />
      </div>
      <p>
        This is my first web page using version control with Git and GitHub.
      </p>
      <!--added MSU Logo to the webpage-->

      <img
        src="images/msu_logo.jpg"
        class="img-fluid"
        alt="MSU Logo"
        width="200"
        height="200"
      />
    </div>

    <script>
      // Load only the #dark-site-nav element from navbar.html
      $("#nav-placeholder").load("nav_dark_mode.html #dark-site-nav");
    </script>
  </body>
</html>
