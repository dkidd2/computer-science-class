<!doctype html>
<html lang="en">
  <head>
    <!--added my portriat pic-->
    <style>
      .my-pic {
        width: 80px;
        height: 80px;
        margin: 1px 40px 135px 400px;
      }
    </style>
    <title>Bootstrap Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>
 <div class="container">
 <!-- Web page content goes inside Bootstrap container(s) -->
     <div class="container" style="margin: auto;">
        
<img
        src="images/start_resume.png"
        class="img margin: auto;"
        alt="mini bike after"
        width="800"
        height="1000"
      /> 
      <img
        src="images/end_resume.png"
        class="img margin: auto;"
        alt="mini bike after"
        width="800"
        height="1000"
      /> 
    <script>
      // Load only the #site-nav element from navbar.html
      $("#nav-placeholder").load("navbar.html #site-nav");
    </script>
  </body>
</html>
