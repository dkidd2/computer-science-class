<!doctype html>
<!--added a dark mode -->
<html lang="en" data-bs-theme="dark">
  <head>
    <!--added my portriat pic-->
    <style>
      .my-pic {
        width: 80px;
        height: 80px;
        margin: 1px 40px 135px 400px;
      }
    </style>
    <title>Bootstrap Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>
    <!-- placing resume in webpage -->
     <div class="container" style="margin: auto;">
       <div class="card bg-secondary" style="margin: 1px 1px 1px 1px;">  
<img
        src="images/start_resume.png"
        class="img margin: auto;"
        alt="mini bike after"
        width="800"
        height="1000"
      />
      <img
        src="images/end_resume.png"
        class="img margin: auto;"
        alt="mini bike after"
        width="800"
        height="1000"
      /> 
      </div>
      </div>
    <script>
      // Load only the #dark-site-nav element from nav_dark_mode.html
      $("#nav-placeholder").load("nav_dark_mode.html #dark-site-nav");
    </script>
  </body>
</html>
